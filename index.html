<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리집 주기 관리</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1d1d1b;--sub:#7a7873;--line:#e7e4de;--ok:#2e9e6a;--soon:#e39a1b;--over:#d9453b;--acc:#3b6fe0;--track:#ece9e3;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#201f1d;--tx:#f1efea;--sub:#9b988f;--line:#323029;--ok:#4ac38a;--soon:#f0b445;--over:#f06a60;--acc:#7fa2ff;--track:#34322c;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(60px + env(safe-area-inset-bottom,0px))}
h1{font-size:22px;margin:6px 0 2px}
.top{display:flex;justify-content:space-between;align-items:flex-end}
.small{font-size:12px;color:var(--sub)}
.linkbtn{background:none;border:0;color:var(--sub);font-size:12px;text-decoration:underline;cursor:pointer;padding:0}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--soon);margin-right:5px}.dot.on{background:var(--ok)}
.sum{margin:10px 0 4px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:14px;display:flex;gap:14px;flex-wrap:wrap}.sum b{font-size:18px}
h2{font-size:14px;color:var(--sub);margin:22px 4px 8px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.title{font-weight:600;font-size:15px;margin-bottom:2px}
.item{padding:8px 0}.item+.item{border-top:1px dashed var(--line)}
.row{display:flex;align-items:center;gap:10px}
.em{font-size:24px;width:34px;text-align:center}
.mid{flex:1;min-width:0;cursor:pointer}
.nm{font-weight:600;font-size:15px}.st{font-size:13px;margin-top:1px}.meta{font-size:11.5px;color:var(--sub);margin-top:2px}
.bar{height:5px;background:var(--track);border-radius:4px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;border-radius:4px}
button{font:inherit;cursor:pointer}
.done{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;white-space:nowrap}.done:disabled{opacity:.5}
.ok{color:var(--ok)}.soon{color:var(--soon)}.over{color:var(--over)}.none{color:var(--sub)}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:8px;background:var(--track);margin-right:6px;font-weight:600}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}.ov.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 12px;font-size:17px}.sheet label{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px}
.sheet input{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:16px}
.btns{display:flex;gap:8px;margin-top:16px}.btns button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-weight:600}.btns .pri{background:var(--acc);color:#fff;border:0}
.join{margin-top:50px}.join p{color:var(--sub);font-size:14px;line-height:1.5}
.mono{font-family:ui-monospace,Menlo,monospace;word-break:break-all;font-size:15px;padding:10px;background:var(--bg);border-radius:10px}
.btns .sel{background:var(--acc);color:#fff;border:0}
input#codeIn{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:16px}
.err{border:1px solid var(--over);color:var(--over);padding:10px 12px;border-radius:12px;font-size:13px;margin-top:10px;display:none}
.hide{display:none!important}
</style>
</head>
<body>

<div id="join" class="join hide">
  <h1>🏡 우리집 주기 관리</h1>
  <p>가족 코드를 입력하세요. 처음이면 "새 코드 만들기"를 누르고, 만든 코드를 가족에게 알려주세요.</p>
  <input id="codeIn" placeholder="가족 코드 (12자 이상)" autocapitalize="off" autocomplete="off" spellcheck="false">
  <button class="linkbtn" id="btnGen" style="margin:8px 0 0">새 코드 만들기</button>
  <p style="margin-bottom:6px">나는…</p>
  <div class="btns" style="margin-top:0"><button id="rH">남편</button><button id="rW">와이프</button></div>
  <div class="btns"><button class="pri" id="btnJoin">입장</button></div>
  <div class="err" id="jerr"></div>
</div>

<div id="app" class="hide">
  <div class="top">
    <h1>🏡 우리집 주기 관리</h1>
    <div class="small"><span id="meTxt"></span> · <button class="linkbtn" id="btnMenu">설정</button></div>
  </div>
  <div class="small" style="margin:4px 2px 0"><span class="dot" id="dot"></span><span id="syncTxt">연결 중…</span></div>
  <div class="err" id="err"></div>
  <div class="sum" id="sum"></div>
  <div id="list"></div>
</div>

<div class="ov" id="ov"><div class="sheet">
  <h3 id="shTitle"></h3>
  <label>주기 (일)</label><input id="shDays" type="number" min="1" inputmode="numeric">
  <label>마지막으로 한 날</label><input id="shLast" type="date">
  <div class="btns"><button id="shCancel">취소</button><button class="pri" id="shSave">저장</button></div>
</div></div>

<div class="ov" id="ov2"><div class="sheet">
  <h3>설정</h3>
  <label>가족 코드 (가족에게만 알려주세요)</label>
  <div class="mono" id="codeShow"></div>
  <div class="btns"><button id="btnSwap">남편/와이프 바꾸기</button><button id="btnLeave">이 폰에서 나가기</button></div>
  <div class="btns"><button id="menuClose">닫기</button></div>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* ===== Firebase 콘솔의 웹앱 설정값으로 교체 ===== */
const firebaseConfig = {
  apiKey: "AIzaSyAYY51rZLp_bwdFlQvCqFFG3HXYdURabkQ",
  authDomain: "house-ed4f7.firebaseapp.com",
  projectId: "house-ed4f7",
  storageBucket: "house-ed4f7.firebasestorage.app",
  messagingSenderId: "714842742643",
  appId: "1:714842742643:web:a56ef92986fb6124122f06"
};
/* 개인 항목(p:true)은 남편/와이프가 따로 기록돼요 */
const TASKS=[
 {g:"집 청소",e:"🧹",id:"vac",n:"청소기",d:3},
 {g:"집 청소",e:"🧽",id:"mop",n:"물청소(물걸레)",d:7},
 {g:"집 청소",e:"🚽",id:"bath",n:"화장실 청소",d:7},
 {g:"몸 관리",e:"💇",id:"hair",n:"머리 자르기",d:35,p:1},
 {g:"몸 관리",e:"🪒",id:"wax",n:"제모",d:21,p:1},
 {g:"몸 관리",e:"👂",id:"ear",n:"귀지 청소",d:30,p:1},
 {g:"몸 관리",e:"🦷",id:"tartar",n:"치석 제거(스케일링)",d:180,p:1},
 {g:"가전 · 필터",e:"❄️",id:"ac",n:"에어컨 청소",d:90},
 {g:"가전 · 필터",e:"🌀",id:"wash",n:"세탁기 청소",d:30},
 {g:"가전 · 필터",e:"💨",id:"purifier",n:"공기청정기 필터",d:180},
 {g:"가전 · 필터",e:"🪟",id:"erv",n:"전열교환기 필터",d:90},
 {g:"가전 · 필터",e:"💧",id:"humid",n:"가습기 청소",d:3},
 {g:"자동차",e:"🛢️",id:"oil",n:"엔진오일 교체",d:180},
 {g:"자동차",e:"🚗",id:"airf",n:"자동차 공기필터",d:365}
];
const WHO={h:"남편",w:"와이프"};

const $=id=>document.getElementById(id);
const app=initializeApp(firebaseConfig), auth=getAuth(app), fs=getFirestore(app);
let data={}, code="", role="", unsub=null, editing=null, authed=false, pick="";
const ls={get:k=>{try{return localStorage.getItem(k)||""}catch(e){return ""}},
          set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},
          del:k=>{try{localStorage.removeItem(k)}catch(e){}}};

const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const toUTC=s=>{const [y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d)};
const dayDiff=(a,b)=>Math.round((toUTC(a)-toUTC(b))/864e5);
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const t=new Date(toUTC(s)+n*864e5);return t.getUTCFullYear()+"-"+pad(t.getUTCMonth()+1)+"-"+pad(t.getUTCDate())};

/* 한 기록(문서)의 상태 계산. 개인 항목은 문서 id가 ear_h, ear_w 처럼 나뉨 */
function calc(docId,def){
  const r=data[docId]||{}, days=r.days||def;
  if(!r.last) return {days,state:"none",left:null,pct:0,r};
  const left=dayDiff(addDays(r.last,days),today());
  const soon=Math.max(1,Math.round(days*0.2));
  return {days,r,left,pct:Math.min(1,Math.max(0,(days-left)/days)),state:left<0?"over":left<=soon?"soon":"ok"};
}
const label=c=>c.state==="none"?"아직 기록 없음":c.left<0?`${-c.left}일 지남`:c.left===0?"오늘 해야 해요":`${c.left}일 남음`;
const colorVar={ok:"var(--ok)",soon:"var(--soon)",over:"var(--over)",none:"var(--track)"};
const rank={over:0,soon:1,ok:2,none:3};

/* 화면에 그릴 "항목" 목록: 공용은 1개, 개인은 (나 먼저) 2개 */
function itemsOf(t){
  if(!t.p) return [{docId:t.id,t,who:null}];
  const order=role==="w"?["w","h"]:["h","w"];
  return order.map(k=>({docId:t.id+"_"+k,t,who:k}));
}
const itemHtml=(it,c,single)=>{
  const r=c.r, mine=!it.who||it.who===role;
  const meta=r.last?`마지막 ${r.last.slice(5).replace("-","/")}${r.by?" · "+r.by:""} · 주기 ${c.days}일`:`주기 ${c.days}일`;
  const head=single?`<div class="em">${it.t.e}</div>`:"";
  const name=single?`<div class="nm">${it.t.n}</div>`:`<div class="nm"><span class="badge">${WHO[it.who]}${it.who===role?" (나)":""}</span></div>`;
  return `<div class="item"><div class="row">${head}
    <div class="mid" data-edit="${it.docId}">${name}<div class="st ${c.state}">${label(c)}</div><div class="meta">${meta}</div></div>
    <button class="done" data-done="${it.docId}">완료</button></div>
    <div class="bar"><i style="width:${Math.round(c.pct*100)}%;background:${colorVar[c.state]}"></i></div></div>`;
};

function render(){
  let over=0,soon=0,ok=0;
  const groups=[...new Set(TASKS.map(t=>t.g))];
  const cardsByGroup=groups.map(g=>{
    const cards=TASKS.filter(t=>t.g===g).map(t=>{
      const its=itemsOf(t).map(it=>({it,c:calc(it.docId,t.d)}));
      // 요약은 "내 것" + 공용만 집계
      its.filter(x=>!x.it.who||x.it.who===role).forEach(({c})=>{
        if(c.state==="over"||(c.state!=="none"&&c.left===0))over++; else if(c.state==="soon")soon++; else if(c.state==="ok")ok++;
      });
      const worst=Math.min(...its.filter(x=>!x.it.who||x.it.who===role).map(x=>rank[x.c.state]));
      const lf=Math.min(...its.map(x=>x.c.left??1e9));
      return {t,its,worst,lf};
    }).sort((a,b)=>a.worst-b.worst||a.lf-b.lf);
    return `<h2>${g}</h2>`+cards.map(({t,its})=>{
      if(!t.p) return `<div class="card">${itemHtml(its[0].it,its[0].c,true)}</div>`;
      return `<div class="card"><div class="title">${t.e} ${t.n}</div>${its.map(x=>itemHtml(x.it,x.c,false)).join("")}</div>`;
    }).join("");
  });
  $("sum").innerHTML=`<div><b class="over">${over}</b> 지금 해야 함</div><div><b class="soon">${soon}</b> 곧 해야 함</div><div><b class="ok">${ok}</b> 여유 있음</div>`;
  $("list").innerHTML=cardsByGroup.join("");
}

const showErr=m=>{const e=$("err");e.textContent=m;e.style.display="block"};
function findTask(docId){const base=docId.replace(/_[hw]$/,"");return TASKS.find(t=>t.id===base)}

async function save(docId,patch){
  const t=findTask(docId), cur=data[docId]||{};
  try{
    await setDoc(doc(fs,"families",code,"tasks",docId),{last:cur.last||null,days:cur.days||t.d,by:cur.by||"",...patch,ts:Date.now()});
    $("err").style.display="none";
  }catch(e){showErr("저장하지 못했어요. 가족 코드가 12자 이상인지, Firestore 규칙이 게시됐는지 확인해 주세요.")}
}

$("list").addEventListener("click",async e=>{
  const d=e.target.closest("[data-done]");
  if(d){d.disabled=true;await save(d.dataset.done,{last:today(),by:WHO[role]});d.disabled=false;return}
  const ed=e.target.closest("[data-edit]");
  if(ed){
    editing=ed.dataset.edit; const t=findTask(editing), r=data[editing]||{};
    const who=editing.match(/_([hw])$/);
    $("shTitle").textContent=t.e+" "+t.n+(who?` · ${WHO[who[1]]}`:"");
    $("shDays").value=r.days||t.d; $("shLast").value=r.last||"";
    $("ov").classList.add("show");
  }
});
$("shCancel").onclick=()=>$("ov").classList.remove("show");
$("ov").addEventListener("click",e=>{if(e.target.id==="ov")$("ov").classList.remove("show")});
$("shSave").onclick=async()=>{
  const days=parseInt($("shDays").value,10);
  if(!(days>0)){showErr("주기는 1일 이상으로 입력해 주세요.");return}
  const last=$("shLast").value||null, cur=data[editing]||{};
  const patch={days}; if(last!==(cur.last||null)){patch.last=last;patch.by=WHO[role]}
  $("ov").classList.remove("show"); await save(editing,patch);
};

/* 설정 */
$("btnMenu").onclick=()=>{$("codeShow").textContent=code;$("ov2").classList.add("show")};
$("menuClose").onclick=()=>$("ov2").classList.remove("show");
$("ov2").addEventListener("click",e=>{if(e.target.id==="ov2")$("ov2").classList.remove("show")});
$("btnSwap").onclick=()=>{role=role==="h"?"w":"h";ls.set("role",role);$("meTxt").textContent=WHO[role];$("ov2").classList.remove("show");render()};
$("btnLeave").onclick=()=>{if(confirm("이 폰에서 나갈까요? 다시 들어오려면 가족 코드가 필요해요.")){ls.del("code");ls.del("role");location.reload()}};

/* 입장 화면 */
const setPick=r=>{pick=r;$("rH").className=r==="h"?"sel":"";$("rW").className=r==="w"?"sel":""};
$("rH").onclick=()=>setPick("h"); $("rW").onclick=()=>setPick("w");
$("btnGen").onclick=()=>{
  const a="abcdefghjkmnpqrstuvwxyz23456789", b=crypto.getRandomValues(new Uint8Array(24));
  $("codeIn").value=[...b].map(x=>a[x%a.length]).join("");
};
$("btnJoin").onclick=()=>{
  const c=$("codeIn").value.trim().toLowerCase(), je=$("jerr");
  je.style.display="block";
  if(!/^[a-z0-9-]{12,}$/.test(c)){je.textContent="코드는 영문 소문자·숫자·하이픈으로 12자 이상이어야 해요.";return}
  if(!pick){je.textContent="남편인지 와이프인지 골라 주세요.";return}
  if(!authed){je.textContent="연결 중이에요. 잠시 후 다시 눌러 주세요.";return}
  je.style.display="none"; ls.set("code",c); ls.set("role",pick); code=c; role=pick; start();
};

function start(){
  $("join").classList.add("hide"); $("app").classList.remove("hide");
  $("meTxt").textContent=WHO[role]; render();
  if(unsub)unsub();
  unsub=onSnapshot(collection(fs,"families",code,"tasks"),snap=>{
    const m={}; snap.forEach(d=>m[d.id]=d.data()); data=m;
    $("dot").className="dot on";
    $("syncTxt").textContent=snap.metadata.fromCache?"오프라인 · 연결되면 동기화돼요":"실시간 동기화 중";
    render();
  },()=>{$("dot").className="dot";$("syncTxt").textContent="동기화 오류 · 코드와 규칙을 확인해 주세요"});
}

/* 익명 로그인 → 저장된 코드가 있으면 바로 입장 */
onAuthStateChanged(auth,user=>{
  if(!user){signInAnonymously(auth).catch(()=>{$("jerr").style.display="block";$("jerr").textContent="익명 로그인에 실패했어요. 콘솔에서 익명 로그인을 켰는지 확인해 주세요."});$("join").classList.remove("hide");return}
  authed=true;
  code=ls.get("code"); role=ls.get("role");
  if(code&&role) start(); else $("join").classList.remove("hide");
});
setInterval(()=>code&&render(),60*60*1000);
</script>
</body>
</html>
